[workspace]
resolver = "2"
members = [
    "pingora-core",
    "pingora-proxy",
    "pingora-cache",
    "pingora-header-serde",
    "pingora-lru",
    "pingora-http",
    "pingora-http-parser",
    "pingora-error",
    "pingora-timeout",
    "pingora-pool",
    "pingora-runtime",
    "pingora-rustls",
]

[workspace.dependencies]
bstr = "1.12.0"
tokio = "1"
tokio-stream = { version = "0.1" }
tokio-util = { version = "0.7.12", features = ["rt"] }
async-trait = "0.1.42"
httparse = "1"
pingora-http-parser = { version = "0.9.0", path = "pingora-http-parser" }
bytes = "1.0"
http = "1"
log = "0.4"
futures = "0.3"
h2 = ">=0.4.16"
once_cell = "1"
lru = "0.18.2"
ahash = ">=0.8.9"

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(tokio_unstable)'] }

[profile.bench]
debug = true
