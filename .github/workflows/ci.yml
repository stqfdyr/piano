name: ci

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # New RustSec advisories make cargo deny fail without any change here.
    - cron: '17 3 * * 1'

permissions:
  contents: read

concurrency:
  # A newer push to a pull request replaces its run; runs on main each have a group of
  # their own, so none is cancelled and every commit there keeps its result (releases
  # depend on it).
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # No debug info: builds faster and makes the target directory, which is the cache,
  # less than half the size. Panic messages still name the file and line.
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  ci:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Installs what rust-toolchain.toml names.
      - run: rustup toolchain install
      - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: cargo-deny@0.21.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Pull requests read main's cache and never write their own, so they cannot
          # evict it or hand anything to main.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo xtask ci

  # Releases are static musl builds, which the job above never makes; a dependency
  # update or a libc call can break them without failing anything else. This is the
  # release build with the same target, flags and static check, minus LTO for speed.
  musl:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo xtask dist
        env:
          CARGO_PROFILE_RELEASE_LTO: 'false'
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '16'
