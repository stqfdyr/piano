name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  # Builds with read-only permissions: dependency build scripts never see a token that
  # can publish or sign. No cache: a release is built from scratch.
  build:
    runs-on: ubuntu-24.04
    # Up to 60 minutes waiting for ci, then the release build.
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools
      - run: rustup toolchain install
      - name: Check the tag against the workspace version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "piano") | .version')
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME, workspace $version"; exit 1; }
      # A release is cut only from a commit on main whose latest ci run there (push or
      # weekly) passed; the build and tests are not run again. A tag pushed right after
      # a merge waits for that run; a failed query counts as not answered yet.
      - name: Check the tag is on main and passed ci
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          none=0
          for _ in $(seq 120); do
            status=$(gh api "repos/$GITHUB_REPOSITORY/compare/main...$GITHUB_SHA" -q .status || echo unknown)
            case $status in
            identical | behind) ;;
            unknown) sleep 30; continue ;;
            *) echo "$GITHUB_SHA is not on main ($status)"; exit 1 ;;
            esac
            latest=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci --branch main \
              --commit "$GITHUB_SHA" --limit 20 --json event,status,conclusion \
              -q '[.[] | select(.event == "push" or .event == "schedule")][0]
                  | if . == null then "none" elif .status != "completed" then "running"
                    else .conclusion end' || echo unknown)
            case $latest in
            success) exit 0 ;;
            running | unknown) ;;
            none)
              # Only the head of a push gets a run of its own.
              none=$((none + 1))
              if [ "$none" -ge 20 ]; then
                echo "$GITHUB_SHA has no ci run on main; tag a commit that has one"
                exit 1
              fi
              ;;
            *) echo "latest ci run on $GITHUB_SHA: $latest"; exit 1 ;;
            esac
            sleep 30
          done
          echo "no finished ci run on $GITHUB_SHA after 60 minutes"
          exit 1
      # Advisories published since that ci run still stop the release.
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-deny@0.21.0
      - run: cargo deny --locked check
      - run: cargo xtask dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: |
            target/dist/piano-*.tar.gz
            target/dist/piano-*.tar.gz.sha256
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - run: cd dist && sha256sum --check piano-*.tar.gz.sha256
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/piano-*.tar.gz
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "$GITHUB_REF_NAME" --generate-notes \
            dist/piano-*.tar.gz dist/piano-*.tar.gz.sha256
