[graph]
targets = ["x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl", "aarch64-unknown-linux-musl"]
all-features = false

[advisories]
version = 2
yanked = "deny"
# Unmaintained crates reached only through the vendored pingora fork; each goes away
# with a fork patch that drops or replaces the dependency.
ignore = [
    { id = "RUSTSEC-2024-0388", reason = "derivative: pingora-core derives" },
    { id = "RUSTSEC-2024-0449", reason = "unsafe-libyaml: pingora-core YAML config loading, unused" },
    { id = "RUSTSEC-2025-0134", reason = "rustls-pemfile: pingora-rustls PEM helpers, unused" },
    { id = "RUSTSEC-2026-0543", reason = "chrono: pingora-core timestamps" },
]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
